[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-market"
version = "0.1.0"
description = "Independent raw preview of approved Vietnamese job postings"
requires-python = ">=3.11"
dependencies = ["streamlit==1.66.1", "pandas==3.1.0", "matplotlib==3.11.2", "seaborn==0.13.2", "openpyxl==3.1.5"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[project.scripts]
career-market = "career_market.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/career_market"]

[tool.hatch.build.targets.wheel.force-include]
"datasets/raw" = "career_market/datasets/raw"
"datasets/provenance" = "career_market/datasets/provenance"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
