[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-market"
version = "0.1.0"
description = "Dự đoán lương CNTT Việt Nam và tư vấn kỹ năng"
requires-python = ">=3.11"
dependencies = ["streamlit==1.66.1", "pandas==3.1.0", "matplotlib==3.11.2", "seaborn==0.13.2", "scikit-learn==1.9.1", "joblib==1.6.0", "numpy==2.4.6", "scipy==1.17.1"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0"]

[project.scripts]
career-market = "career_market.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/career_market"]

[tool.hatch.build.targets.wheel.force-include]
"datasets/reference" = "career_market/datasets/reference"
"datasets/raw" = "career_market/datasets/raw"
"datasets/processed/salary_dataset_v2.csv" = "career_market/datasets/processed/salary_dataset_v2.csv"
"datasets/processed/salary_dataset_v2.json" = "career_market/datasets/processed/salary_dataset_v2.json"
"artifacts/salary-v2" = "career_market/artifacts/salary-v2"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
# Notebook trình bày không theo chuẩn lint của mã nguồn.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
