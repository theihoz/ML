services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8502:8502"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8502/_stcore/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s