services:
  app:
    image: ml-salary-demo:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${DEMO_PORT:-8502}:8502"
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8502/_stcore/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
